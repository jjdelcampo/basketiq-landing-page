<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta http-equiv="refresh" content="0; url=./pitch-club-deploy/" />
  <title>BasketIQ - Pitch Club</title>
  <link rel="canonical" href="./pitch-club-deploy/" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b0f19;
      --text: #ffffff;
      --muted: #94a3b8;
      --blue: #3b82f6;
      --glass: rgba(255,255,255,0.04);
      --glass-border: rgba(255,255,255,0.09);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: "Outfit", sans-serif;
      background:
        radial-gradient(circle at top, rgba(59,130,246,0.18), transparent 35%),
        var(--bg);
      color: var(--text);
    }

    .card {
      width: min(560px, 100%);
      padding: 32px;
      border-radius: 20px;
      background: var(--glass);
      border: 1px solid var(--glass-border);
      text-align: center;
      box-shadow: 0 24px 60px rgba(0,0,0,0.35);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.05;
    }

    p {
      margin: 0 0 20px;
      color: var(--muted);
      line-height: 1.6;
    }

    a {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 10px;
      background: var(--blue);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Pitch trasladado</h1>
    <p>La version canonica y protegida del pitch del club vive ahora en <code>pitch-club-deploy/index.html</code>.</p>
    <a href="./pitch-club-deploy/">Abrir pitch del club</a>
  </main>
</body>
</html>
